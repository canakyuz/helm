name: Bug report
description: Report something that behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security issue? **Don't use this form** - open a
        [Security Advisory](https://github.com/canakyuz/helm/security/advisories/new)
        instead.

  - type: dropdown
    id: area
    attributes:
      label: Which layer
      options:
        - Mobile (Expo)
        - Web (Refine)
        - Edge function / migration
        - Shared package (@helm/*)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste error messages or logs verbatim - mask any credentials.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Which commit are you on? (`git rev-parse --short HEAD`)

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I'm confident this isn't a misconfiguration of my own Supabase setup
        - label: My report contains no real credentials
          required: true
