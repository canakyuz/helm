name: Feature request
description: Propose a new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Helm was written for one person's needs first and is selective about scope.
        Talk it through here before starting anything large — a rejected PR wastes
        both our time.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the problem, not the feature. What can't you do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
      description: Why don't the existing tools cover it?

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to build this myself
