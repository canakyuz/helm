# Her push ve PR'da koşan kapı. Üç iş paralel: sır → tip → lint.
#
# NEDEN AYRI JOB'LAR: tek job olsaydı sır taraması typecheck'in 90 saniyesini
# beklerdi. Sır bulgusu en acil sinyal — kendi başına, saniyeler içinde kırmızı
# olmalı. Ayrıca hangi katmanın düştüğü Actions listesinde tek bakışta görünür.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aynı branch'e arka arkaya push edilirse eskisini iptal et — sıra beklemesin.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Sır taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Yalnızca tracked dosyalar. History taraması (`audit-secrets`) bilerek
      # burada değil: eski commit'lerdeki rotate edilmiş değerler her koşuda
      # kırmızı verir ve gerçek bulguyu gürültüye boğardı.
      - name: Tracked dosyalarda sır ara
        run: ./scripts/check-secrets.sh tree

  typecheck:
    name: Tip kontrolü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Tüm workspace'ler: 6 paket + mobil + web. Web'in `typecheck` script'i
      # sonradan eklendi; öncesinde `build` içine gömülü olduğu için 226 dosya
      # CI'da hiç kontrol edilmiyordu.
      - name: Tüm workspace'ler
        run: bun run typecheck

  lint:
    name: Lint (mobil)
    runs-on: ubuntu-latest
    # RAPORLAR, BLOKLAMAZ — bilinçli. Depoda 18 mevcut eslint hatası var
    # (react-hooks/refs ve exhaustive-deps ağırlıklı). Bloklayan bir kapı ilk
    # günden kırmızı olurdu; kırmızı doğan kapı da okunmaz hale gelir. Borç
    # temizlenince continue-on-error kaldırılacak ve kapı sertleşecek.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Yalnızca mobilde eslint yapılandırması var. Web'e eklenirse buraya ikinci
      # bir adım gelir — sessizce kapsam dışı kalmasın diye not düşülüyor.
      - name: Mobil
        run: |
          set -uo pipefail
          cd apps/mobile
          bun run lint 2>&1 | tee /tmp/lint.log || true
          tail -1 /tmp/lint.log >> "$GITHUB_STEP_SUMMARY"
