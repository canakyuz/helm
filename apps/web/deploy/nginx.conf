# helm.wesan.co — nginx alternatifi (Caddy yoksa). TLS: certbot --nginx.
# Basic-auth dosyası:  htpasswd -c /etc/nginx/.htpasswd-helm can

server {
    listen 80;
    server_name helm.wesan.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name helm.wesan.co;

    ssl_certificate     /etc/letsencrypt/live/helm.wesan.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helm.wesan.co/privkey.pem;

    root /var/www/helm/dist;
    index index.html;

    # Auth duvarı (tek kullanıcı, RLS permissive).
    auth_basic           "helm";
    auth_basic_user_file /etc/nginx/.htpasswd-helm;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }

    # İçerik-hash'li asset'ler → uzun cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
